version: '3.9'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pass_app
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: ./server
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/pass_app
      PORT: 5000
    ports:
      - '5000:5000'
    depends_on:
      - db

  client:
    build: ./client
    environment:
      VITE_API_URL: http://server:5000
      CLIENT_PORT: 5173
    ports:
      - '5173:5173'
    depends_on:
      - server

volumes:
  pgdata:
